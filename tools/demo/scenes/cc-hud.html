<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cc-hud demo</title>
<style>
  .pane { position: absolute; z-index: 8; display: none; box-sizing: border-box; border-radius: 9px; border: 1px solid #6b6b70; background: #121214; overflow: hidden;
    box-shadow: 0 18px 44px rgba(0,0,0,0.65); }
</style>
</head>
<body>
<script type="module">
// 终端版动图: 面板 / 散步道 / 子代理看板 / 收据都是 record.mjs 用真代码录下来的格子 (out/rec/cc-hud.<lang>.json),
// 这里只把格子画出来, 再加上引擎自己的界面 (会话记录、输入框、转圈、提示条 —— 近似画法)、鼠标和标题
// 剧本 (时间、对话文字) 在 cc-hud.story.js, 和录制器共用; ?lang=en|zh
import { Grid, drawGrid, metrics, dw } from '../lib/cells.js'
import { makeStage, termWindow, makePointer, canvasLayer, makeToast, toastK, pathAt, seg, easeOut, easeInOut, typed, lerp } from '../lib/stage.js'
import { transcript, inputBox, spinner } from '../lib/claude.js'
import * as S from './cc-hud.story.js'

const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en'
const T = S.TEXT[lang]
const rec = await (await fetch('../out/rec/cc-hud.' + lang + '.json', { cache: 'no-store' })).json()

// ---------------- 尺寸 ----------------
const { COLS, ROWS, FPS, DURATION } = S
const CW = 8, CH = 16, SIZE = 13.65
const W = 1200, H = 626
// 从上到下: 会话记录 (0-16 行, 底部对齐) / 转圈 / 散步道 (天空行 + 3 行) / 输入框 / 面板 (工具栏 + 3 行 + 引擎提示行)
const TOP_ROWS = 17, SPIN_ROW = 17, STRIP_ROW = 18, INPUT_ROW = 22, PANEL_ROW = 25, PANEL_COL = 1

const frameAt = t => rec.frames[Math.min(rec.frames.length - 1, Math.max(0, Math.round(t * FPS)))]

// 录下来的一段 = [文字, 前景, 背景, 粗, 暗]; 暗色 (dimColor) 照终端的画法压暗
const DIM_FG = '#8a8a8a'
function mixHex(a, b, k) {
  const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16))
  const x = p(a), y = p(b)
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join('')
}
function styleOf(r) {
  if (r.length === 1) return {}
  const [, fg, bg, b, d] = r
  const color = d ? (fg ? mixHex(fg, '#0c0c0c', 0.45) : DIM_FG) : fg ?? undefined
  return { fg: color, bg: bg ?? undefined, bold: !!b }
}
function drawRuns(g, row, col, runs, max = g.cols) {
  let c = col
  for (const r of runs ?? []) c = g.text(row, c, r[0], styleOf(r), max)
  return c
}

// 长句子折行 (英文按词, 中文按字)
function wrap(s, width) {
  const out = []
  let line = ''
  const parts = lang === 'zh' ? [...s] : s.split(/(?<= )/)
  for (const p of parts) {
    if (dw(line + p) > width && line) {
      out.push(line.trimEnd())
      line = p.trimStart()
    } else line += p
  }
  if (line) out.push(line)
  return out
}

// ---------------- 一帧终端画面 ----------------
function hoverKey(t) {
  if (t >= S.AGENTS.arriveAt && t < S.AGENTS.leaveAt) return 'btn-agents'
  if (t >= S.HANDOFF.arriveAt && t < S.HANDOFF.leaveAt) return 'btn-handoff'
  return ''
}
function drawTerminal(ctx, m, t) {
  const f = frameAt(t)
  const g = new Grid(COLS, ROWS)
  // 会话记录: 先排在一张高的格子里, 再取最底下 TOP_ROWS 行 (内容多了往上滚, 和终端一样)
  const tall = new Grid(COLS, 80)
  const items = []
  if (t >= S.ENTER) items.push({ kind: 'user', text: T.prompt })
  for (const x of S.TOOLS) {
    if (t < x.start) continue
    const ok = t >= x.end
    items.push({ kind: 'tool', name: x.tool, args: x.tool === 'Agent' ? T.agentDesc : x.args, state: ok ? 'ok' : 'run', blink: !ok && Math.floor((t - x.start) / 0.4) % 2 === 1, result: ok ? [x.result] : [] })
  }
  if (t >= S.FINAL_AT) items.push({ kind: 'text', text: wrap(typed(T.final, t, S.FINAL_AT, (S.FINAL_END - S.FINAL_AT) / [...T.final].length), COLS - 4) })
  let end = transcript(tall, -1, items)
  // 一轮结束: 引擎的 "✻ Baked for 9s" + cc-hud 接在后面的收据 (录下来的那一行)
  if (f.turn) {
    end += 1
    drawRuns(tall, end, 0, f.turn)
    end += 1
  }
  const from = Math.max(0, end - TOP_ROWS)
  for (let r = 0; r < TOP_ROWS; r++) {
    g.cells[r] = tall.cells[from + r] ?? g.cells[r]
    g.bgs[r] = tall.bgs[from + r] ?? g.bgs[r]
  }
  if (t >= S.TURN_START && t < S.COMPLETE) spinner(g, SPIN_ROW, t, Math.floor(t - S.TURN_START), 'Baking')
  f.strip.forEach((runs, r) => drawRuns(g, STRIP_ROW + r, 0, runs))
  const text = t < S.ENTER ? typed(T.prompt, t, S.TYPE_AT, (S.TYPE_END - S.TYPE_AT) / [...T.prompt].length) : ''
  const typing = t >= S.TYPE_AT && t < S.ENTER
  inputBox(g, INPUT_ROW, text, typing || Math.floor(t / 0.53) % 2 === 0)
  f.panel.forEach((runs, r) => drawRuns(g, PANEL_ROW + r, PANEL_COL, runs))
  // 指针压在按钮上: 按钮反色 (引擎对 Button 的固定画法)
  const hk = hoverKey(t)
  const b = hk && f.btns[hk]
  if (b) {
    const row = PANEL_ROW + b[0]
    for (let k = 0; k < b[2]; k++) {
      const c = PANEL_COL + b[1] + k
      const cell = g.cells[row]?.[c]
      if (cell && !cell.cont) cell.fg = '#0c0c0c'
      g.bgs[row][c] = '#ffffff'
    }
  }
  drawGrid(ctx, g, 0, 0, m)
}

// ---------------- 舞台 ----------------
makeStage(W, H)
const winX = Math.round((W - (COLS * CW + 24)) / 2)
const win = termWindow({ x: winX, y: 64, cols: COLS, rows: ROWS, cw: CW, ch: CH, size: SIZE, title: S.CWD.split('/').pop() })
const body = win.el.querySelector('.termbody')
body.style.position = 'relative'
const fadeLayer = canvasLayer(body, 12, 9, COLS * CW, ROWS * CH, 20)
const toast = makeToast(win.el, 14, 38 + 10)

// 子代理看板 (侧边面板): 内容是录下来的 buildAgentsPane, 外框是示意 (引擎的面板外框没有公开)
const PANE_W = rec.paneCols + 4
const PANE_COL = COLS - PANE_W
let lastPane = null
const paneEl = document.createElement('div')
paneEl.className = 'pane'
paneEl.style.left = 12 + PANE_COL * CW + 'px'
paneEl.style.top = 9 + 1 * CH + 'px'
paneEl.style.width = PANE_W * CW + 'px'
body.appendChild(paneEl)
let paneLayer = null
function drawPane(rows) {
  const n = rows.length + 2
  if (!paneLayer) {
    paneEl.style.height = n * CH + 'px'
    paneLayer = canvasLayer(paneEl, -1, -1, PANE_W * CW, n * CH, 1)
  }
  const ctx = paneLayer.begin()
  const m = metrics(ctx, CW, CH, SIZE)
  const g = new Grid(PANE_W, n)
  rows.forEach((runs, r) => drawRuns(g, 1 + r, 2, runs, PANE_W - 2))
  drawGrid(ctx, g, 0, 0, m)
}

// 鼠标: 从右下进场, 点 "+1代理" (看板), Esc 关掉后离开; 再进场点 [交接]
const pointer = makePointer()
function btnXY(key, t) {
  const b = frameAt(t).btns[key] ?? [0, 0, 1]
  return [win.originX + (PANEL_COL + b[1] + b[2] / 2) * CW, win.originY + (PANEL_ROW + b[0] + 0.62) * CH]
}
const P_FROM = [win.originX + 98 * CW, win.originY + 33 * CH]
const trips = [
  { key: 'btn-agents', ...S.AGENTS },
  { key: 'btn-handoff', ...S.HANDOFF },
]
function pointerAt(t) {
  const trip = trips.find(x => t >= x.inAt && t < x.goneAt)
  if (!trip) return null
  const [bx, by] = btnXY(trip.key, trip.arriveAt)
  const [x, y] = pathAt([[trip.inAt, ...P_FROM], [trip.arriveAt, bx, by], [trip.leaveAt, bx, by], [trip.goneAt, ...P_FROM]], t)
  const alpha = Math.min(seg(t, trip.inAt, trip.inAt + 0.3), 1 - seg(t, trip.goneAt - 0.3, trip.goneAt))
  return { x, y, alpha, down: Math.abs(t - trip.clickAt) < 0.06, rk: seg(t, trip.clickAt, trip.clickAt + 0.55) }
}

// 标题: 左边是散步道里同一只螃蟹 (同一帧的格子, 缩小画), 后面是标题和这一段在演什么
const CAP_CW = 5, CAP_CH = 10, CAP_COLS = 14
const cap = document.createElement('div')
cap.className = 'caption'
cap.style.left = winX + 4 + 'px'
cap.style.top = '14px'
cap.innerHTML = `<canvas id="capcrab" style="width:${CAP_COLS * CAP_CW}px;height:${4 * CAP_CH}px;align-self:center"></canvas><b>${T.title}</b><span id="capsub"></span>`
document.body.appendChild(cap)
const capSub = document.getElementById('capsub')
function drawCaption(t) {
  const f = frameAt(t)
  const cv = document.getElementById('capcrab')
  const dpr = window.devicePixelRatio || 1
  const w = CAP_COLS * CAP_CW, h = 4 * CAP_CH
  if (cv.width !== w * dpr) {
    cv.width = w * dpr
    cv.height = h * dpr
  }
  const ctx = cv.getContext('2d')
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.clearRect(0, 0, w, h)
  if (f.crab) {
    // 只取螃蟹附近的方块字符 (气泡文字、粒子不要)
    const full = new Grid(rec.stripW, 4)
    f.strip.forEach((runs, r) => drawRuns(full, r, 0, runs))
    const g = new Grid(CAP_COLS, 4)
    const c0 = f.crab.bx - 1
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < CAP_COLS; c++) {
        const cell = full.cells[r][c0 + c]
        const cp = cell?.ch?.codePointAt(0) ?? 0
        if (cp >= 0x2580 && cp <= 0x259f) {
          g.cells[r][c] = cell
          g.bgs[r][c] = full.bgs[r][c0 + c]
        }
      }
    drawGrid(ctx, g, 0, 0, metrics(ctx, CAP_CW, CAP_CH, 9))
  }
  let k = 0
  T.phases.forEach(([s], i) => {
    if (t >= s) k = i
  })
  const [s, text] = T.phases[k]
  if (capSub.textContent !== text) capSub.textContent = text
  capSub.style.opacity = k === 0 ? 1 : easeOut(seg(t, s, s + 0.35))
}

function mainCanvas() {
  const ctx = win.begin().ctx
  return { ctx, m: metrics(ctx, CW, CH, SIZE) }
}

window.demo = {
  width: W,
  height: H,
  fps: FPS,
  duration: DURATION,
  check: [1.6, 4.0, 7.6, 10.8, 12.3, 13.4, 15.0, 17.6, 20.5, 23.4], // 抽查用的时刻 (秒)
  gif: { dither: 'bayer:bayer_scale=4' },
  ready: Promise.all([document.fonts.load('13px "Cascadia Mono"'), document.fonts.load('bold 13px "Cascadia Mono"'), document.fonts.load('13px "Microsoft YaHei"'), document.fonts.ready]),
  renderFrame(t) {
    drawCaption(t)
    const { ctx, m } = mainCanvas()
    drawTerminal(ctx, m, t)
    // 看板滑入 / 滑出 (关掉以后用最后一次的内容滑出去)
    const f = frameAt(t)
    if (f.pane) lastPane = f.pane
    const kin = easeOut(seg(t, S.AGENTS.clickAt + 0.05, S.AGENTS.clickAt + 0.35))
    const kout = easeInOut(seg(t, S.AGENTS.closeAt, S.AGENTS.closeAt + 0.25))
    const vis = kin > 0 && kout < 1 && lastPane
    paneEl.style.display = vis ? 'block' : 'none'
    if (vis) {
      paneEl.style.opacity = kin * (1 - kout)
      paneEl.style.transform = `translateX(${lerp(36, 0, kin) + 36 * kout}px)`
      drawPane(f.pane ?? lastPane)
    }
    // 提示条 (toast): 位置和样子是示意
    toast.set(f.toast?.text ?? '', f.toast ? toastK(t, f.toast.at, Math.min(f.toast.ms / 1000, 30)) : null)
    // 指针和点击涟漪
    const p = pointerAt(t)
    pointer.set(p?.x ?? 0, p?.y ?? 0, !!p, !!p?.down, p?.alpha ?? 0)
    pointer.ripple(p?.x ?? 0, p?.y ?? 0, p && p.rk > 0 && p.rk < 1 ? p.rk : null)
    // 循环衔接: 结尾淡回开头那一帧
    const k = easeOut(seg(t, S.FADE_AT, DURATION - 1 / FPS))
    fadeLayer.canvas.style.display = k > 0 ? 'block' : 'none'
    fadeLayer.canvas.style.opacity = k
    if (k > 0) {
      const fctx = fadeLayer.begin('#0c0c0c')
      drawTerminal(fctx, metrics(fctx, CW, CH, SIZE), 0)
    }
  },
}
</script>
</body>
</html>
