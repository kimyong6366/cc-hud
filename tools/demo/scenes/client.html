<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cc-hud client demo</title>
<style>
  .app { position: absolute; border-radius: 12px; overflow: hidden; background: #1f1f1e; z-index: 1;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 28px 70px rgba(0,0,0,0.62), 0 10px 26px rgba(0,0,0,0.45); }
  .app-bar { height: 38px; background: #1a1a19; display: flex; align-items: center; padding-left: 14px; gap: 9px; color: #d6d6d3; font-size: 12.5px; position: relative; border-bottom: 1px solid #2a2a28; }
  .app-bar .ctl { position: absolute; right: 0; top: 0; height: 38px; display: flex; }
  .app-bar .ctl div { width: 46px; height: 38px; display: flex; align-items: center; justify-content: center; }
  .col { position: absolute; }
  .msg-user { position: absolute; right: 0; background: #2f2f2d; color: #ececea; border-radius: 16px; padding: 9px 15px; font-size: 14.5px; max-width: 70%; }
  .tool { position: absolute; left: 0; display: flex; align-items: center; gap: 9px; color: #a3a3a0; font-size: 13px; }
  .tool .dot { width: 7px; height: 7px; border-radius: 50%; }
  .tool b { color: #d6d6d3; font-weight: 600; }
  .tool code { font-family: "Cascadia Mono", monospace; font-size: 12.5px; color: #a3a3a0; }
  .msg-ai { position: absolute; left: 0; color: #ececea; font-size: 14.5px; }
  .card { position: absolute; left: 0; background: #2b2b2b; border-radius: 14px; padding: 16px 18px; box-sizing: content-box; }
  .card .row { display: flex; align-items: center; gap: 15px; }
  .card .crab { flex: 0 0 auto; }
  .card .crab svg { display: block; }
  .card .dash { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .card .dash svg { display: block; max-width: 100%; height: auto; }
  .input { position: absolute; left: 0; border: 1px solid #444; border-radius: 12px; box-sizing: border-box; padding: 0 14px; color: #77776f; font-size: 14px; display: flex; align-items: center; }
  .input .send { margin-left: auto; width: 26px; height: 26px; border-radius: 8px; background: #d97757; display: flex; align-items: center; justify-content: center; }
  /* 工具栏: 客户端自己画原生按钮 / 下拉框; 这里照它的深色界面近似画 */
  .bar { position: absolute; left: 0; display: flex; align-items: center; gap: 8px; height: 28px; font: 13px "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  .nb { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 8px; box-sizing: border-box; white-space: nowrap; background: #353533; color: #ececea; border: 1px solid #4a4a46; }
  .nb.primary { background: #d97757; border-color: #d97757; color: #1c1917; font-weight: 600; }
  .nb.hover { background: #43433f; }
  .nb.primary.hover { background: #e3906f; border-color: #e3906f; }
  .nb.down { transform: scale(0.95); }
  .ns-l { display: inline-flex; align-items: center; gap: 8px; color: #9a9a95; white-space: nowrap; }
  .ns { display: inline-flex; align-items: center; gap: 10px; height: 28px; padding: 0 10px; border-radius: 8px; box-sizing: border-box; background: #2a2a28; border: 1px solid #4a4a46; color: #ececea; }
  .ns i { font-style: normal; font-size: 10px; color: #9a9a95; }
  .bar .sp { width: 10px; }
</style>
</head>
<body>
<script type="module">
// 客户端 (桌面 App) 版动图: 螃蟹和仪表盘是 record.mjs 用真代码 (buildDesktop -> crabSvg / dashSvg) 录下来的 SVG
// (out/rec/client.<lang>.json, 每帧一个编号 + 这张图换上的时刻); 这里只画聊天界面、标题, 按时间播 SVG 里的 SMIL 动画
// 剧本 (时间、对话文字) 在 client.story.js, 和录制器共用; ?lang=en|zh
import { makeStage, makePointer, makeToast, toastK, pathAt, seg, easeOut, typed } from '../lib/stage.js'
import * as S from './client.story.js'

const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en'
const T = S.TEXT[lang]
const rec = await (await fetch('../out/rec/client.' + lang + '.json', { cache: 'no-store' })).json()
const frameAt = t => rec.frames[Math.min(rec.frames.length - 1, Math.max(0, Math.round(t * S.FPS)))]

const W = 1200, H = 604
const { FPS, DURATION } = S

// 卡片宽度: 照 register.tsx 的 buildDesktop (横栏 COLS 格, 每格约 7.35 像素)
const PX_PER_COL = 7.35
const contentW = Math.round(S.COLS * PX_PER_COL)

// ---------------- 舞台 ----------------
makeStage(W, H)
const AW = 1060, AH = 490
const AX = (W - AW) / 2, AY = 74
const COLW = contentW + 36
const colX = (AW - COLW) / 2
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

function buildApp(z) {
  const app = document.createElement('div')
  app.className = 'app'
  app.style.cssText = `left:${AX}px;top:${AY}px;width:${AW}px;height:${AH}px;z-index:${z}`
  app.innerHTML = `
    <div class="app-bar">Claude
      <div class="ctl">
        <div><svg width="10" height="10"><rect y="4.5" width="10" height="1" fill="#cfcfcf"/></svg></div>
        <div><svg width="10" height="10"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="#cfcfcf"/></svg></div>
        <div><svg width="10" height="10"><path d="M.5 .5 9.5 9.5M9.5 .5 .5 9.5" stroke="#cfcfcf"/></svg></div>
      </div></div>
    <div class="col" style="left:${colX}px;top:38px;width:${COLW}px;height:${AH - 38}px">
      <div class="msgs"></div>
      <div class="bar"></div>
      <div class="card" style="width:${contentW}px"><div class="row"><div class="crab"></div><div class="dash"></div></div></div>
      <div class="input" style="width:${COLW}px;height:52px"><span></span><div class="send"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5" stroke="#1c1917" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div></div>
    </div>`
  document.body.appendChild(app)
  return { app, msgs: app.querySelector('.msgs'), bar: app.querySelector('.bar'), card: app.querySelector('.card'), crab: app.querySelector('.crab'), dash: app.querySelector('.dash'), input: app.querySelector('.input'), crabId: -1, dashId: -1, barHtml: '' }
}
const main = buildApp(1)
const fade = buildApp(2)

// 录下来的一张 SVG 放进容器; 同一张图不重放 (换图时 SMIL 动画从头播, 和客户端一样), 动画时间 = t - 这张图换上的时刻
function showSvg(el, id, since, t, v, key) {
  if (v[key] !== id) {
    el.innerHTML = rec.svgs[id] ?? ''
    v[key] = id
  }
  const svg = el.querySelector('svg')
  if (svg && svg.pauseAnimations) {
    svg.pauseAnimations()
    svg.setCurrentTime(Math.max(0, t - since))
  }
}

// 工具栏: 录下来的按钮 / 下拉框按顺序画; 指针停在哪个按钮上就画成悬停, 按下的那一下缩一点
function drawBar(v, items, hover, down) {
  let prev = ''
  const html = items
    .map(it => {
      const gap = it.t === 's' && prev === 'b' ? '<span class="sp"></span>' : ''
      prev = it.t
      if (it.t === 's') return `${gap}<span class="ns-l">${esc(it.l)}<span class="ns">${esc(it.val)}<i>▼</i></span></span>`
      const cls = ['nb', it.v === 'primary' ? 'primary' : '', it.k === hover ? 'hover' : '', it.k === down ? 'down' : ''].filter(Boolean).join(' ')
      return `<span class="${cls}" data-k="${esc(it.k)}">${esc(it.l)}</span>`
    })
    .join('')
  if (v.barHtml !== html) {
    v.bar.innerHTML = html
    v.barHtml = html
  }
}

// 鼠标: 剧本里的每一趟 (进场 -> 停在按钮上 -> 按下 -> 离开)
const tripAt = t => S.TRIPS.find(x => t >= x.inAt && t < x.goneAt)
const downAt = (trip, t) => (trip && trip.clicks.some(c => Math.abs(t - c) < 0.06) ? trip.key : '')

function draw(v, t, live = false) {
  // 消息
  const parts = []
  let y = 22
  if (t >= S.ENTER) {
    parts.push(`<div class="msg-user" style="top:${y}px">${esc(T.prompt)}</div>`)
    y += 58
  }
  for (const x of S.TOOLS) {
    if (t < x.start) continue
    const ok = t >= x.end
    const dot = ok ? '#4eba65' : Math.floor((t - x.start) / 0.4) % 2 ? '#5a5a57' : '#a3a3a0'
    parts.push(`<div class="tool" style="top:${y}px"><span class="dot" style="background:${dot}"></span><b>${x.tool}</b><code>${esc(x.tool === 'Agent' ? T.agentDesc : x.args)}</code></div>`)
    y += 30
  }
  if (t >= S.FINAL_AT) parts.push(`<div class="msg-ai" style="top:${y + 10}px">${esc(typed(T.final, t, S.FINAL_AT, (S.FINAL_END - S.FINAL_AT) / [...T.final].length))}</div>`)
  v.msgs.innerHTML = parts.join('')
  // 卡片 + 输入框贴在底部
  const cardH = v.card.offsetHeight
  const inputTop = AH - 38 - 52 - 22
  v.input.style.top = inputTop + 'px'
  const cardTop = inputTop - 12 - cardH
  v.card.style.top = cardTop + 'px'
  v.bar.style.top = cardTop - 10 - 28 + 'px'
  // 螃蟹 / 仪表盘: 录下来的真 SVG; 上面一行是录下来的工具栏
  const f = frameAt(t)
  const trip = live ? tripAt(t) : undefined
  drawBar(v, f.bar ?? [], trip && t >= trip.arriveAt && t < trip.leaveAt ? trip.key : '', downAt(trip, t))
  showSvg(v.crab, f.c, f.cs, t, v, 'crabId')
  showSvg(v.dash, f.d, f.ds, t, v, 'dashId')
  const typing = t >= S.TYPE_AT && t < S.ENTER
  v.input.firstChild.textContent = typing ? typed(T.prompt, t, S.TYPE_AT, (S.TYPE_END - S.TYPE_AT) / [...T.prompt].length) : T.placeholder
  v.input.style.color = typing ? '#ececea' : '#77776f'
}

// 指针和提示条 (提示条的样子是示意: 客户端怎么画 toast 没有公开)
const pointer = makePointer()
const toast = makeToast(main.app, 18, 50, 560)
const P_FROM = [AX + AW - 140, AY + AH - 40]
function target(key) {
  const el = main.bar.querySelector(`[data-k="${key}"]`)
  if (!el) return P_FROM
  const r = el.getBoundingClientRect()
  return [r.left + Math.min(r.width / 2, 34), r.top + r.height * 0.62]
}
const aim = {} // 每一趟的目标位置 (第一次看到按钮时量好; 按钮字变长也不跟着挪)
function drawPointer(t) {
  const trip = tripAt(t)
  if (!trip) {
    pointer.set(0, 0, false)
    pointer.ripple(0, 0, null)
    return
  }
  const [bx, by] = (aim[trip.key + trip.inAt] ??= target(trip.key))
  const [x, y] = pathAt([[trip.inAt, ...P_FROM], [trip.arriveAt, bx, by], [trip.leaveAt, bx, by], [trip.goneAt, ...P_FROM]], t)
  const alpha = Math.min(seg(t, trip.inAt, trip.inAt + 0.3), 1 - seg(t, trip.goneAt - 0.3, trip.goneAt))
  pointer.set(x, y, true, !!downAt(trip, t), alpha)
  const last = [...trip.clicks].reverse().find(c => t >= c)
  const rk = last === undefined ? 0 : seg(t, last, last + 0.55)
  pointer.ripple(x, y, rk > 0 && rk < 1 ? rk : null)
}

// 标题
const cap = document.createElement('div')
cap.className = 'caption'
cap.style.left = AX + 4 + 'px'
cap.style.top = '24px'
cap.innerHTML = `<b>${esc(T.title)}</b><span>${esc(T.sub)}</span>`
document.body.appendChild(cap)

window.demo = {
  width: W,
  height: H,
  fps: FPS,
  duration: DURATION,
  check: [0.5, 1.5, 4.3, 7.0, 11.5, 13.6, 15.5, 17.6, 19.4], // 抽查用的时刻 (秒)
  ready: document.fonts.ready,
  renderFrame(t) {
    draw(main, t, true)
    drawPointer(t)
    const f = frameAt(t)
    toast.set(f.toast?.text ?? '', f.toast ? toastK(t, f.toast.at, Math.min(f.toast.ms / 1000, 30)) : null)
    const k = easeOut(seg(t, S.FADE_AT, DURATION - 1 / FPS))
    fade.app.style.display = k > 0 ? 'block' : 'none'
    fade.app.style.opacity = k
    if (k > 0) draw(fade, 0)
  },
}
</script>
</body>
</html>
